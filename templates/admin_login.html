<!DOCTYPE html>
<html>
<head>

    <title>Admin Portal</title>

    <meta charset="UTF-8">

    <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI',sans-serif;
    }

    body{

        height:100vh;

        display:flex;

        justify-content:center;

        align-items:center;

        background:
        linear-gradient(
            135deg,
            #eef2ff,
            #dbeafe
        );
    }

    .login-box{

        width:380px;

        background:white;

        padding:40px;

        border-radius:24px;

        box-shadow:
        0 10px 40px rgba(0,0,0,0.08);

        animation:fadeIn 0.6s ease;
    }

    @keyframes fadeIn{

        from{
            opacity:0;
            transform:translateY(20px);
        }

        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    h1{

        text-align:center;

        color:#1e293b;

        margin-bottom:10px;

        font-size:28px;
    }

    .subtitle{

        text-align:center;

        color:#64748b;

        margin-bottom:30px;

        font-size:14px;
    }

    .input-group{

        margin-bottom:20px;
    }

    .input-group label{

        display:block;

        margin-bottom:8px;

        color:#334155;

        font-size:14px;

        font-weight:600;
    }

    .input-group input{

        width:100%;

        padding:14px;

        border-radius:12px;

        border:1px solid #cbd5e1;

        outline:none;

        transition:0.3s;

        font-size:14px;
    }

    .input-group input:focus{

        border-color:#6366f1;

        box-shadow:
        0 0 0 4px rgba(99,102,241,0.15);
    }

    button{

        width:100%;

        padding:14px;

        border:none;

        border-radius:12px;

        background:#6366f1;

        color:white;

        font-size:15px;

        font-weight:600;

        cursor:pointer;

        transition:0.3s;
    }

    button:hover{

        background:#4f46e5;

        transform:translateY(-2px);
    }

    .footer{

        margin-top:20px;

        text-align:center;

        color:#94a3b8;

        font-size:12px;
    }

    </style>

</head>

<body>

<div class="login-box">

    <h1>
        Admin Portal
    </h1>

    <div class="subtitle">
        Secure Cybersecurity Dashboard Access
    </div>

    <form method="POST">

        <div class="input-group">

            <label>
                Username
            </label>

            <input
            type="text"
            name="username"
            placeholder="Enter admin username"
            required
            >

        </div>

        <div class="input-group">

            <label>
                Password
            </label>

            <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
            >

        </div>

        <button type="submit">
            Login to Dashboard
        </button>

    </form>

    <div class="footer">
        Matrix Honeypot Security Console
    </div>

</div>

</body>
</html>
